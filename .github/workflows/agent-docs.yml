name: Agent docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skills:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/zizmor-requirements.txt
      - name: Check skill inventory and negative controls
        run: |
          python3 .github/scripts/check-skills.py
          python3 -m unittest discover -s tests/check-skills
          python3 -m unittest discover -s tests/crc-polynomial
      - name: Test mruby idiom probe runner without Ruby toolchain
        run: python3 -m unittest discover -s tests/mruby-idiomatic

  wiki:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Wiki and notification tests
        run: |
          python3 .github/scripts/check-wiki.py
          python3 -m unittest discover -s tests/check-wiki
          python3 -m unittest discover -s tests/vendor-release-watch

  workflows:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/zizmor-requirements.txt
      - name: Install pinned workflow auditors
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/zizmor-requirements.txt
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
      - name: Audit workflows and whitespace
        run: |
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/*.yml
          zizmor --offline .github/workflows
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
