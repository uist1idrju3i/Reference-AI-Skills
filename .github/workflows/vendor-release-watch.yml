name: Vendor release watch

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vendor-release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Notify stable vendor updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/vendor_release_watch.py --write
